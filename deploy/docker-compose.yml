# Whole stack on one VPS: Caddy (HTTPS + static frontend + reverse proxy) in
# front of the Node backend. Expects both repos cloned side by side:
#   ~/vckscribble-be   (this repo; run compose from deploy/)
#   ~/vckscribble-fe
# Usage: cp .env.example .env && edit && docker compose up -d --build
name: vckscribble

services:
  backend:
    build: ..
    restart: unless-stopped
    environment:
      # Caddy is the only way in, so its X-Forwarded-For is trustworthy and
      # per-IP limits see real client addresses.
      TRUST_PROXY: "1"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      WORDS_API_TOKEN: ${WORDS_API_TOKEN:-}
      IP_LIMIT_SCALE: ${IP_LIMIT_SCALE:-1}
      # Players' browsers connect straight to the backend on DIRECT_PORT, which
      # serves HTTPS itself with Caddy's certificate (copied in by
      # sync-certs.sh): game frames skip Caddy entirely.
      TLS_CERT_DIR: /certs
      TLS_DOMAIN: ${GAME_HOST:?set GAME_HOST in deploy/.env (see .env.example)},${EXTRA_GAME_HOSTS:-}
      DIRECT_PORT: ${DIRECT_PORT:-8443}
      # Players whose network allows only port 443 come through Caddy instead,
      # over these Unix sockets on a shared volume, one per process.
      SOCKET_PATH: /run/vmock/backend-{shard}.sock
      # One game-server process per CPU core, each owning a share of the rooms
      # (process N on DIRECT_PORT + N). "auto" follows the server's core count.
      SHARDS: ${SHARDS:-auto}
    volumes:
      - game-data:/data
      - sockets:/run/vmock
      - ${CERT_DIR:-/opt/vmock-skribble/certs}:/certs:ro
    # The host's network, so DIRECT_PORT is a real port on the server with no
    # Docker forwarding in between. It listens on nothing else.
    network_mode: host
    # One socket per player; the default 1024 descriptors caps you well
    # below "hundreds of concurrent users" once proxy connections count too.
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    stop_grace_period: 10s

  web:
    build:
      context: ../../vckscribble-fe
      args:
        # Each page connects to the name it was loaded from, if it is one of these.
        VITE_DIRECT_SOCKET_HOST: ${GAME_HOST},${EXTRA_GAME_HOSTS:-}
        VITE_DIRECT_SOCKET_PORT: ${DIRECT_PORT:-8443}
    restart: unless-stopped
    # Started, not healthy: on a new server the backend waits for the
    # certificate that Caddy has yet to obtain.
    depends_on:
      backend: { condition: service_started }
    # The host's network directly, not Docker's bridge: players' traffic skips
    # Docker's port forwarding (NAT and connection tracking). Caddy binds 80
    # and 443 (and 443/udp for HTTP/3) itself; the host firewall (ufw) now
    # governs them, and setup-server.sh opens exactly those.
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN}
      GAME_HOST: ${GAME_HOST}
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - sockets:/run/vmock
      - caddy-data:/data      # TLS certificates — keep, or Let's Encrypt rate-limits you
      - caddy-config:/config

volumes:
  game-data:
  sockets:
  caddy-data:
  caddy-config:
