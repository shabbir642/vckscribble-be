# fly launch --no-deploy generates this; committed so deploys are reproducible.
app = "vckscribble"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Inside the container, not on a volume. The dictionary re-seeds itself at
  # boot, so nothing here needs to survive a restart and the app can run on
  # ephemeral storage — see "Storage" in the README.
  DATABASE_URL = "/tmp/game.db"
  # Set CLIENT_ORIGIN to the deployed frontend URL:
  #   fly secrets set CLIENT_ORIGIN=https://vckscribble.pages.dev
  # and WORDS_API_TOKEN to enable POST /api/words.

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero between sessions: this is played in bursts, and a stopped
  # machine bills storage only. The cost is a few seconds of cold start on the
  # first request, and any room still open when it stops is lost — rooms live in
  # memory. Set min_machines_running = 1 if you would rather pay to avoid that.
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Rooms live in memory, so a second machine would not see the first's rooms.
  # Scaling out needs shared state (Redis adapter) first — see PLAN.md.
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  timeout = "3s"
  method = "GET"
  path = "/api/health"

# Smallest machine Fly offers. Node plus SQLite at party-game scale fits
# comfortably, and without this block deploy picks a larger, pricier default.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# No [mounts]: nothing is persisted. Add a volume back only if you want word
# statistics or owner-added words to survive a restart.
